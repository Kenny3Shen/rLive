<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弹幕历史滚动范围夹具</title>
    <style>
      /* 外部滚动容器：历史页里由 Shell 的 app-page 承担，夹具照它的形态造一个。 */
      #scroller {
        height: 700px;
        overflow-y: auto;
        width: var(--w, 700px);
      }
    </style>
  </head>
  <body>
    <div id="scroller" data-slot="app-page">
      <div style="height: 120px">筛选行占位</div>
      <div id="fixture"></div>
    </div>
    <script type="module" src="./history-danmaku-scroll.tsx"></script>
  </body>
