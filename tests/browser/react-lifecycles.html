<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React 生命周期回归</title>
    <link rel="icon" type="image/svg+xml" href="/rlive.svg" />
    <style>
      /* 弹幕列表滚动回归：夹具页面没有 Tailwind，手动给出面板需要的高度链，
         使嵌套滚动视口真正可滚。 */
      [data-danmaku-scroll-fixture] {
        width: 360px;
        height: 280px;
      }
      [data-danmaku-scroll-fixture] > div {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      [data-danmaku-scroll-fixture] > div > div {
        position: relative;
        flex: 1 1 0;
        min-height: 0;
      }
      [data-danmaku-scroll-fixture] [data-slot="scroll-area"] {
        height: 100%;
      }
      [data-danmaku-scroll-fixture] [data-slot="scroll-area-viewport"] {
        height: 100%;
        overflow-y: auto;
      }
      /* 行按钮在生产样式里是占满整行的块级元素；不补齐会把多行挤进同一行，
         列表不再溢出，滚动断言全部失效。 */
      [data-danmaku-scroll-fixture] [data-slot="scroll-area-viewport"] > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 10px;
      }
      [data-danmaku-scroll-fixture] [data-slot="scroll-area-viewport"] button {
        display: block;
        width: 100%;
      }
      [data-danmaku-scroll-fixture] [aria-label="滚动到底部"] {
        position: absolute;
        right: 10px;
        bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="fixture"></div>
    <pre id="result">正在运行</pre>
    <script type="module">
      import { runReactLifecycleRegressions } from "./react-lifecycles.tsx";
      const result = document.getElementById("result");
      try {
        const passed = await runReactLifecycleRegressions(document.getElementById("fixture"));
        result.textContent = JSON.stringify({ passed }, null, 2);
        result.dataset.status = "passed";
      } catch (error) {
        result.textContent = String(error.stack || error);
        result.dataset.status = "failed";
        console.error(error);
      }
    </script>
  </body>
</html>
