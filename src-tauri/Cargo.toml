[package]
name = "rlive"
version = "0.9.0"
description = "A Tauri App"
authors = ["KennyShen"]
edition = "2024"

[lib]
name = "rlive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native document picker used by profile import and export on desktop/mobile.
tauri-plugin-dialog = "2"
# The dialog plugin yields Android content:// URIs. Register the filesystem
# bridge so profile imports and exports can read and write those user-selected
# documents without trying to coerce them into invalid POSIX paths.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "brotli", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.91"
base64 = "0.22"
md-5 = "0.10"
hex = "0.4"
# Two TLS backends, selected per site at the call site:
#   * native-tls (SChannel on Windows / OpenSSL elsewhere) for Douyu danmaku
#     only, whose proxy ports offer nothing but static-RSA AES-GCM suites.
#     rustls does not implement static RSA key exchange at all, so those
#     handshakes fail with HandshakeFailure.
#   * rustls for every other site.
# Note the sharp edge: with `native-tls` enabled, a `None` connector means
# native-tls, so non-Douyu call sites pass an explicit connector. See
# danmaku::tls.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "native-tls"] }
# Used by danmaku::tls to build that explicit rustls connector. `ring` rather
# than the default `aws_lc_rs` provider: the latter needs a C toolchain, which
# the Android targets do not have configured. tokio-rustls re-exports `rustls`,
# so rustls itself is not needed as a direct dependency.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
futures-util = "0.3"
flate2 = "1"
brotli = "7"
uuid = { version = "1", features = ["v4"] }
boa_engine = "0.20"
#crispasr = "0.8.24"

[target.'cfg(target_os = "android")'.dependencies]
# Douyu's danmaku ports need native-tls (see danmaku::tls), and Android has no
# system OpenSSL for Cargo to link against, so build openssl-sys from source
# there. Desktop targets use the platform stack and skip this.
openssl = { version = "0.10", features = ["vendored"] }

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true # 启用链接时优化。
opt-level = "s" # 优先考虑小的二进制文件大小。如果您更喜欢性能，请使用 `3`。
panic = "abort" # 通过禁用 panic 处理程序来提高性能。
strip = true # 确保移除调试符号。
