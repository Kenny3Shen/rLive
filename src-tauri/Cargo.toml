[package]
name = "rlive"
version = "9.3.0"
description = "A Tauri App"
authors = ["KennyShen"]
edition = "2024"

[lib]
name = "rlive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Link FFmpeg from static archives instead of the platform's shared libraries.
#
# The macOS and Linux release builds enable this; Windows ships the pinned
# FFmpeg DLLs instead. It must stay an opt-in feature rather than a
# `cfg(...)` dependency entry: Cargo resolves features as a global union across
# every target section, so requesting `ffmpeg-next/static` there would also
# switch Windows to static linking, where it is built against the shared
# runtime DLLs. A local development build on any platform keeps using whatever
# FFmpeg pkg-config finds unless the feature is passed explicitly.
ffmpeg-static = ["ffmpeg-next/static"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native document picker used by profile import and export on desktop/mobile.
tauri-plugin-dialog = "2"
# The dialog plugin yields Android content:// URIs. Register the filesystem
# bridge so profile imports and exports can read and write those user-selected
# documents without trying to coerce them into invalid POSIX paths.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
# Single TLS backend everywhere: native-tls (SChannel on Windows / OpenSSL
# elsewhere). Douyu's danmaku proxy ports offer only static-RSA suites that
# rustls does not support, so HTTP (reqwest) and WebSocket (tokio-tungstenite)
# both use native-tls.
# reqwest 保持 0.12；前端 HTTP IPC 复用本客户端与应用级 ProxyRoute。
# `query`/`form` are built-in in 0.12, not cargo features.
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "native-tls", "gzip", "brotli", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.91"
base64 = "0.23"
md-5 = "0.11"
hex = "0.4"
percent-encoding = "2"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
# TCP keepalive on danmaku sockets. Long-lived idle WebSocket connections are
# otherwise aged out by NAT/firewall middleboxes, which surfaces as an
# unannounced RST (WSAECONNRESET / os error 10054 on Windows).
socket2 = { version = "0.6", features = ["all"] }
futures-util = "0.3"
flate2 = "1"
brotli = "9"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Local ASR is a desktop-only feature. The CrispASR runtime is downloaded on
# first enable and loaded with libloading, so nothing native is linked at build
# time; keep its archive, checksum and loader dependencies out of Android.
dirs = "7"
tar = "0.4"
sha2 = "0.11"
libloading = "0.9"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
# `ffmpeg-next` is an in-process binding to the platform's FFmpeg libraries.
# Desktop build environments must provide matching headers/import libraries
# and package the corresponding runtime libraries.
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format"] }
# `ffmpeg-sys-next` is pinned through `ffmpeg-next`'s own `=9.0.0` requirement;
# do not relax that to a range. 9.0.1 crashes its own build script with
# STATUS_STACK_OVERFLOW on Windows (reproduced by swapping only this version in
# an otherwise identical tree, where 9.0.0 builds). Its only changes are a
# bindgen `-fno-builtin` flag and a `libavutil/spherical.h` header, neither of
# which rLive needs. Revisit once upstream fixes the crash.
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
# The Windows CUDA 12.6 CrispASR runtime ships as a zip archive.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Reading the "Internet Settings" proxy for the "跟随系统代理" mode. reqwest's own
# system-proxy feature would pull the same crate in, but only through hyper-util,
# which gives no way to reuse the value for FFmpeg recording and the danmaku
# WebSocket tunnel.
windows-registry = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
# Douyu's danmaku ports need native-tls, and Android has no
# system OpenSSL for Cargo to link against, so build openssl-sys from source
# there. Desktop targets use the platform stack and skip this.
openssl = { version = "0.10", features = ["vendored"] }

[profile.dev]
opt-level = 1 # 启用基础优化，避免未优化产物占用大量空间。
debug = 0 # 不生成调试信息。
incremental = false # 不保留增量编译缓存。

[profile.test]
# 继承 dev 的基础优化，显式关闭调试信息和增量缓存。
debug = 0
incremental = false

[profile.release]
codegen-units = 1 # 减少并行代码生成带来的优化损失。
lto = true # 启用链接时优化。
opt-level = 3 # 优先运行性能。
panic = "abort" # 不生成 unwind 处理代码。
strip = true # 移除调试符号和符号表。
debug = 0 # 不生成调试信息。
incremental = false # 不保留增量编译缓存。

[lints.rust]
# MSVC 链接器每次都会往 stdout 打印「正在创建库 rlive_lib.dll.lib 和对象 ...」，
# 这是 `#[warn(linker_messages)]` 的提示而非问题。真正的链接警告走 stderr，
# 不受这条影响；关掉它以免每次构建都显示一条无意义的 warning。
linker_messages = "allow"
