[package]
name = "rlive"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "rlive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Automation bridge for https://github.com/hypothesi/mcp-server-tauri (localhost only)
tauri-plugin-mcp-bridge = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "brotli", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.91"
base64 = "0.22"
md-5 = "0.10"
hex = "0.4"
# native-tls (SChannel on Windows / OpenSSL elsewhere): Douyu danmaku only
# offers RSA-AES-GCM suites that modern rustls rejects → HandshakeFailure.
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio-native-tls = "0.3"
futures-util = "0.3"
flate2 = "1"
brotli = "7"
uuid = { version = "1", features = ["v4"] }
boa_engine = "0.20"
# Local, CPU-only Whisper.cpp bindings used by the opt-in live caption worker.
# `whisper-rs` has no default GPU feature; keep it explicit so Windows release
# builds remain portable and do not acquire a CUDA/Metal dependency.
# 0.11 keeps a bundled FFI snapshot, so a Windows release does not require a
# separate host libclang install. Its loader accepts Whisper GGML `.bin`
# models; the tiny local patch below aligns one fallback enum with the
# snapshot's u32 ABI.
whisper-rs = { version = "=0.11.1", default-features = false }
# Pure-Rust OpenCC conversion for displaying Chinese ASR results in Simplified
# Chinese. It has no native dependency, model, or runtime data files.
ferrous-opencc = { version = "0.4", default-features = false, features = ["t2s-conversion"] }

[patch.crates-io]
# `WHISPER_DONT_GENERATE_BINDINGS=1` makes whisper-rs-sys use its checked-in
# Linux-generated binding snapshot. On Windows MSVC that snapshot exposes
# `whisper_gretype` as u32, whereas whisper-rs 0.11.1 assumes a native i32
# bindgen result. The vendored wrapper keeps the enum representation aligned
# with the actual fallback binding without changing the native C ABI.
whisper-rs = { path = "vendor/whisper-rs" }

# Desktop release: smaller + faster binary (web player + sites + proxy).
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
panic = "abort"
