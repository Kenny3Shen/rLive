[package]
name = "rlive"
version = "3.0.0"
description = "A Tauri App"
authors = ["KennyShen"]
edition = "2024"

[lib]
name = "rlive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Link FFmpeg from static archives instead of the platform's shared libraries.
#
# The macOS and Linux release builds enable this; Windows ships the pinned
# FFmpeg DLLs instead. It must stay an opt-in feature rather than a
# `cfg(...)` dependency entry: Cargo resolves features as a global union across
# every target section, so requesting `ffmpeg-next/static` there would also
# switch Windows to static linking, where it is built against the shared
# runtime DLLs. A local development build on any platform keeps using whatever
# FFmpeg pkg-config finds unless the feature is passed explicitly.
ffmpeg-static = ["ffmpeg-next/static"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native document picker used by profile import and export on desktop/mobile.
tauri-plugin-dialog = "2"
# The dialog plugin yields Android content:// URIs. Register the filesystem
# bridge so profile imports and exports can read and write those user-selected
# documents without trying to coerce them into invalid POSIX paths.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
# Single TLS backend everywhere: native-tls (SChannel on Windows / OpenSSL
# elsewhere). Douyu's danmaku proxy ports offer only static-RSA suites that
# rustls does not support, so HTTP (reqwest) and WebSocket (tokio-tungstenite)
# both use native-tls.
# reqwest is pinned to 0.12 so that rlive and tauri-plugin-http share one
# compilation unit on desktop (tauri core itself needs 0.13 on mobile only).
# `query`/`form` are built-in in 0.12, not cargo features.
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "native-tls", "gzip", "brotli", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.91"
base64 = "0.22"
md-5 = "0.11"
hex = "0.4"
percent-encoding = "2"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
# TCP keepalive on danmaku sockets. Long-lived idle WebSocket connections are
# otherwise aged out by NAT/firewall middleboxes, which surfaces as an
# unannounced RST (WSAECONNRESET / os error 10054 on Windows).
socket2 = { version = "0.6", features = ["all"] }
futures-util = "0.3"
flate2 = "1"
brotli = "8"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.15"

tauri-plugin-http = { version = "2.5.9", default-features = false, features = ["native-tls", "charset"] }

# Keep the Rust wrapper, vendored FFI crate, verified runtime archives and
# download checksums on the same Sherpa release; upgrade them as one unit.
[target.'cfg(target_os = "macos")'.dependencies]
sherpa-onnx = "=1.13.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux always uses the CPU-only shared runtime; CUDA provider libraries are not
# part of the desktop build.
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["shared"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Local ASR is a desktop-only feature. Keep its model archive and data-path
# dependencies out of the Android Rust graph as well as out of the UI.
dirs = "6"
tar = "0.4"
bzip2 = "0.6"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
# `ffmpeg-next` is an in-process binding to the platform's FFmpeg libraries.
# Desktop build environments must provide matching headers/import libraries
# and package the corresponding runtime libraries.
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
# Windows builds use the shared CUDA-capable runtime. The native build script
# still permits SHERPA_ONNX_GPU=0 for a CPU-only build without changing Rust
# code or the model/provider settings.
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["shared"] }
sha2 = "0.11"
libloading = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
# Douyu's danmaku ports need native-tls, and Android has no
# system OpenSSL for Cargo to link against, so build openssl-sys from source
# there. Desktop targets use the platform stack and skip this.
openssl = { version = "0.10", features = ["vendored"] }

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true # 启用链接时优化。
opt-level = 3 # 优先考虑小的二进制文件大小。如果您更喜欢性能，请使用 `3`。
panic = "abort" # 通过禁用 panic 处理程序来提高性能。
strip = true # 确保移除调试符号。

[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
