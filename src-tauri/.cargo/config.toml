# Optional faster linking. Uncomment when the tool is installed and verified.
#
# Windows (MSVC + rust-lld):
#   rustup component add llvm-tools-preview
#   [target.x86_64-pc-windows-msvc]
#   linker = "rust-lld"
#
# Linux (mold):
#   [target.x86_64-unknown-linux-gnu]
#   linker = "clang"
#   rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Slightly better codegen for typical desktop CPUs without breaking older machines.
[env]
# whisper-rs-sys ships a bundled FFI binding snapshot. Using it avoids a
# libclang installation solely for bindgen; CMake and the native C++ compiler
# are still required to build whisper.cpp itself on Windows. The pinned
# whisper-rs wrapper normalizes its enum ABI for this fallback on Windows.
WHISPER_DONT_GENERATE_BINDINGS = "1"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
