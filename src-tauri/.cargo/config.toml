# Optional faster linking. Uncomment when the tool is installed and verified.
#
# Windows (MSVC + rust-lld):
#   rustup component add llvm-tools-preview
#   [target.x86_64-pc-windows-msvc]
#   linker = "rust-lld"
#
# Linux (mold):
#   [target.x86_64-unknown-linux-gnu]
#   linker = "clang"
#   rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Slightly better codegen for typical desktop CPUs without breaking older machines.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
