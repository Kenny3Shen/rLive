name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Check tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"

          test -n "$package_version"
          test "$package_version" = "$tauri_version"
          test "$package_version" = "$cargo_version"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows x64 packages
    needs: verify-version
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      SHERPA_ONNX_GPU: "1"
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run tauri -- build --ci --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $binary = "src-tauri/target/release/rlive.exe"
          if (-not (Test-Path $binary)) {
            throw "Windows executable was not produced."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$vsInstall/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found in the Visual Studio installation."
          }
          & $dumpbin /imports $binary | Out-File "$env:RUNNER_TEMP/rlive-imports.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports = Get-Content "$env:RUNNER_TEMP/rlive-imports.txt" -Raw
          if ($imports -notmatch "Delay Load Import" -or $imports -notmatch "sherpa-onnx-c-api.dll") {
            throw "sherpa-onnx-c-api.dll is not configured as a delay-loaded dependency."
          }

      - name: Create Windows portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "src-tauri/target/release/*.dll" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "release-assets/windows" | Out-Null

          $binary = (Resolve-Path "src-tauri/target/release/rlive.exe").Path
          $process = Start-Process -FilePath $binary -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Windows executable exited before the smoke-test window without ASR runtime DLLs."
          }
          Stop-Process -Id $process.Id -Force

          $portable = Join-Path $env:RUNNER_TEMP "rlive-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $binary (Join-Path $portable "rlive.exe")
          $zip = "release-assets/windows/rLive_$($env:RELEASE_VERSION)_windows-x64-portable.zip"
          Compress-Archive -Path "$portable/*" -DestinationPath $zip -CompressionLevel Optimal

          $zipEntries = @(tar -tf $zip)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($zipEntries.Count -ne 1 -or $zipEntries[0] -ne "rlive.exe") {
            throw "Portable ZIP must contain only rlive.exe."
          }

      - name: Bundle Windows installers (NSIS setup and MSI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run tauri -- bundle --ci --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($setup.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable, found $($setup.Count)."
          }
          Copy-Item $setup[0].FullName `
            "release-assets/windows/rLive_$($env:RELEASE_VERSION)_windows-x64-setup.exe"

          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI installer, found $($msi.Count)."
          }
          Copy-Item $msi[0].FullName `
            "release-assets/windows/rLive_$($env:RELEASE_VERSION)_windows-x64.msi"

          if (Get-ChildItem "release-assets/windows" -Recurse -Filter "*.dll" -File) {
            throw "Windows release assets unexpectedly contain ASR runtime DLLs."
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: |
            release-assets/windows/*.exe
            release-assets/windows/*.msi
            release-assets/windows/*.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x86_64 package
    needs: verify-version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      SHERPA_ONNX_GPU: "1"
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux binary and stage ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          bun run tauri -- build --ci --no-bundle

          test -f src-tauri/target/release/libsherpa-onnx-c-api.so
          test -f src-tauri/target/release/libonnxruntime.so
          patchelf --set-rpath '$ORIGIN/../lib/rlive' src-tauri/target/release/rlive

      - name: Create Debian package with ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_config="$RUNNER_TEMP/tauri-release-linux.json"
          runtime_files="$RUNNER_TEMP/rlive-linux-runtime-files.json"

          find "$PWD/src-tauri/target/release" -maxdepth 1 -type f -name '*.so*' \
            -printf '%p\t%f\n' | sort | \
            jq -Rn '
              [inputs | split("\t") | {
                key: ("/usr/lib/rlive/" + .[1]),
                value: .[0]
              }] | from_entries
            ' > "$runtime_files"
          test "$(jq 'length' "$runtime_files")" -gt 0
          jq -n --slurpfile files "$runtime_files" \
            '{ bundle: { linux: { deb: { files: $files[0] } } } }' > "$runtime_config"

          bun run tauri -- bundle --ci --bundles deb --config "$runtime_config"

          mapfile -t deb_files < <(
            find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | sort
          )
          test "${#deb_files[@]}" -eq 1

          verify_dir="$RUNNER_TEMP/rlive-deb-contents"
          dpkg-deb --extract "${deb_files[0]}" "$verify_dir"
          test -x "$verify_dir/usr/bin/rlive"
          test -f "$verify_dir/usr/lib/rlive/libsherpa-onnx-c-api.so"
          test -f "$verify_dir/usr/lib/rlive/libonnxruntime.so"
          readelf -d "$verify_dir/usr/bin/rlive" | grep -Fq '$ORIGIN/../lib/rlive'
          if LD_LIBRARY_PATH="$verify_dir/usr/lib/rlive" ldd "$verify_dir/usr/bin/rlive" | grep -q 'not found'; then
            LD_LIBRARY_PATH="$verify_dir/usr/lib/rlive" ldd "$verify_dir/usr/bin/rlive"
            exit 1
          fi

          mkdir -p release-assets/linux
          cp "${deb_files[0]}" \
            "release-assets/linux/rLive_${RELEASE_VERSION}_linux-amd64.deb"

      - name: Create Linux portable ZIP with ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          portable_dir="$RUNNER_TEMP/rlive-linux-portable"
          rm -rf "$portable_dir"
          mkdir -p "$portable_dir/lib"

          cp src-tauri/target/release/rlive "$portable_dir/rlive"
          find "$PWD/src-tauri/target/release" -maxdepth 1 -type f -name '*.so*' \
            -exec cp {} "$portable_dir/lib/" \;
          test -f "$portable_dir/lib/libsherpa-onnx-c-api.so"
          test -f "$portable_dir/lib/libonnxruntime.so"

          patchelf --set-rpath '$ORIGIN/lib' "$portable_dir/rlive"
          readelf -d "$portable_dir/rlive" | grep -Fq '$ORIGIN/lib'
          if LD_LIBRARY_PATH="$portable_dir/lib" ldd "$portable_dir/rlive" | grep -q 'not found'; then
            LD_LIBRARY_PATH="$portable_dir/lib" ldd "$portable_dir/rlive"
            exit 1
          fi

          zip_path="$PWD/release-assets/linux/rLive_${RELEASE_VERSION}_linux-x64-portable.zip"
          (cd "$portable_dir" && zip -r -X "$zip_path" .)
          unzip -l "$zip_path"

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release
          path: |
            release-assets/linux/*.deb
            release-assets/linux/*.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.arch }} package
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS app and DMG
        shell: bash
        run: |
          set -euo pipefail
          bun run tauri -- build --ci --bundles dmg --target "${{ matrix.target }}"

          # Tauri deletes rLive.app after creating the DMG, so verify the
          # remaining cargo binary and the app copied into the disk image.
          binary="src-tauri/target/${{ matrix.target }}/release/rlive"
          test -x "$binary"
          file "$binary"
          if otool -L "$binary" | grep -Ei 'sherpa|onnxruntime'; then
            echo "macOS binary unexpectedly links shared ASR runtime libraries." >&2
            exit 1
          fi

          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg_count="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$dmg_count" -eq 1
          dmg_file="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg')"

          mount_point="$RUNNER_TEMP/rlive-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_file" -readonly -nobrowse -mountpoint "$mount_point"
          app_binary="$mount_point/rLive.app/Contents/MacOS/rLive"
          test -x "$app_binary"
          if otool -L "$app_binary" | grep -Ei 'sherpa|onnxruntime'; then
            echo "macOS app unexpectedly links shared ASR runtime libraries." >&2
            hdiutil detach "$mount_point" || true
            exit 1
          fi
          hdiutil detach "$mount_point"

          mkdir -p release-assets/macos
          cp "$dmg_file" \
            "release-assets/macos/rLive_${RELEASE_VERSION}_macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}-release
          path: release-assets/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build signed Android artifacts
    needs: verify-version
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing material
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required Android release secret: ${secret_name}" >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/rlive-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore_path" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" \
            > src-tauri/gen/android/app/keystore.properties

      - name: Build and verify signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          export NDK_HOME="$ANDROID_NDK_HOME"
          ndk_toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$ndk_toolchain/llvm-ranlib"
          export RANLIB_aarch64_linux_android="$ndk_toolchain/llvm-ranlib"
          bun run tauri -- android build --ci --target aarch64 --apk

          mapfile -t apk_files < <(
            find src-tauri/gen/android/app/build/outputs/apk/universal/release \
              -type f -name '*.apk' ! -name '*unsigned*' | sort
          )
          test "${#apk_files[@]}" -eq 1

          apk_path="${apk_files[0]}"
          mapfile -t apk_native_libs < <(unzip -Z1 "$apk_path" | awk '/^lib\// { print }')
          if [[ "${apk_native_libs[*]}" != "lib/arm64-v8a/librlive_lib.so" ]]; then
            printf 'Unexpected APK native libraries:\n%s\n' "${apk_native_libs[*]}" >&2
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk_path"

          if [[ -n "$ANDROID_CERT_SHA256" ]]; then
            actual_apk_fingerprint="$(
              "$apksigner" verify --print-certs "$apk_path" |
                awk -F ': ' '/certificate SHA-256 digest:/ { print $2; exit }' |
                tr -d ':[:space:]' |
                tr '[:lower:]' '[:upper:]'
            )"
            expected_fingerprint="$(
              printf '%s' "$ANDROID_CERT_SHA256" |
                tr -d ':[:space:]' |
                tr '[:lower:]' '[:upper:]'
            )"
            test -n "$actual_apk_fingerprint"
            if [[ "$actual_apk_fingerprint" != "$expected_fingerprint" ]]; then
              echo "Android APK signing certificate did not match ANDROID_CERT_SHA256." >&2
              exit 1
            fi
          fi

          mkdir -p release-assets/android
          cp "$apk_path" "release-assets/android/rLive_${RELEASE_VERSION}_android-arm64-v8a.apk"

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rlive-release.jks" src-tauri/gen/android/app/keystore.properties

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: release-assets/android/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub Release
    needs:
      - verify-version
      - build-windows
      - build-linux
      - build-macos
      - build-android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Create draft release and attach assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/**/*
