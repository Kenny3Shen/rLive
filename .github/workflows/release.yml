name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"

          test -n "$package_version"
          test "$package_version" = "$tauri_version"
          test "$package_version" = "$cargo_version"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows x64 packages
    needs: verify-version
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      SHERPA_ONNX_GPU: "1"
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Builds the trimmed FFmpeg SDK from the pinned official source using the
      # MSYS2 installation the runner image already ships (at C:\msys64, off
      # PATH), then links and stages against it. The distro-equivalent shortcut
      # of downloading a prebuilt full_build archive is deliberately not used:
      # it shipped 116 MB of DLLs for a remux-only application and put the
      # release under a GPLv3 audit.
      - name: Build Windows binary against the trimmed FFmpeg SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./scripts/prepare-windows-ffmpeg.ps1 `
            -ProjectRoot $PWD `
            -StageDestination "$PWD/src-tauri/target/release"
          bun run tauri -- build --ci --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $binary = "src-tauri/target/release/rlive.exe"
          if (-not (Test-Path $binary)) {
            throw "Windows executable was not produced."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$vsInstall/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found in the Visual Studio installation."
          }
          & $dumpbin /imports $binary | Out-File "$env:RUNNER_TEMP/rlive-imports.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports = Get-Content "$env:RUNNER_TEMP/rlive-imports.txt" -Raw
          if ($imports -notmatch "Delay Load Import" -or $imports -notmatch "sherpa-onnx-c-api.dll") {
            throw "sherpa-onnx-c-api.dll is not configured as a delay-loaded dependency."
          }
          foreach ($library in @("avutil", "avcodec", "avformat")) {
            if ($imports -notmatch "$library-[0-9]+\.dll") {
              throw "Windows executable does not import the expected $library runtime DLL."
            }
          }

          # The trimmed SDK's dependency graph is closed: avformat -> avcodec ->
          # avutil and nothing else. A DLL importing an FFmpeg library outside
          # that set means the staged runtime is incomplete and the application
          # would fail to start on a user's machine.
          foreach ($stagedDll in @("avutil", "avcodec", "avformat")) {
            # Not $matches: that is an automatic variable PowerShell overwrites on
            # every -match/-notmatch in this scope, including the one below.
            $stagedFiles = @(Get-ChildItem "src-tauri/target/release" -Filter "$stagedDll-*.dll" -File)
            if ($stagedFiles.Count -ne 1) {
              throw "Expected one staged $stagedDll DLL, found $($stagedFiles.Count)."
            }
            & $dumpbin /imports $stagedFiles[0].FullName |
              Out-File "$env:RUNNER_TEMP/$stagedDll-imports.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dllImports = Get-Content "$env:RUNNER_TEMP/$stagedDll-imports.txt" -Raw
            $unexpected = @(
              [regex]::Matches($dllImports, '(?i)\b(av|sw)[a-z]+-[0-9]+\.dll') |
                ForEach-Object { $_.Value.ToLowerInvariant() } |
                Sort-Object -Unique |
                Where-Object { $_ -notmatch '^(avutil|avcodec|avformat)-[0-9]+\.dll$' }
            )
            if ($unexpected.Count -gt 0) {
              throw "Staged $stagedDll DLL imports unbundled FFmpeg libraries: $($unexpected -join ', ')"
            }
          }

      - name: Bundle Windows installers (NSIS setup and MSI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "release-assets/windows" | Out-Null
          $releaseDirectory = (Resolve-Path "src-tauri/target/release").Path
          $runtimeFiles = @(
            Get-ChildItem $releaseDirectory -File |
              Where-Object { $_.Name -match '^(avutil|avcodec|avformat)-[0-9]+\.dll$' }
          )
          $runtimeFiles += Get-Item (Join-Path $releaseDirectory "FFmpeg-LICENSE.txt")
          $runtimeFiles += Get-Item (Join-Path $releaseDirectory "FFmpeg-README.txt")
          if ($runtimeFiles.Count -ne 5) {
            throw "Expected three FFmpeg DLLs and two notice files for installer bundling."
          }

          $resources = @{}
          foreach ($runtimeFile in $runtimeFiles) {
            $resources[$runtimeFile.FullName] = $runtimeFile.Name
          }
          $runtimeConfig = Join-Path $env:RUNNER_TEMP "tauri-release-windows.json"
          @{ bundle = @{ resources = $resources } } |
            ConvertTo-Json -Depth 4 |
            Set-Content $runtimeConfig -Encoding utf8

          # tauri's WiX bundler globs every *.dll beside the executable and adds
          # all of them to the MSI, keeping only WebView2Loader.dll out of scope
          # of the resources config (upstream tauri-bundler carries a TODO about
          # exactly this). NSIS installs the resources allow list alone, so the
          # two installers disagreed: the MSI shipped the ASR runtime, including
          # a 354 MB onnxruntime_providers_cuda.dll, even though asr.rs
          # downloads that runtime on demand into the user data directory and
          # loads it only from there. Move the DLLs the installers must not
          # carry out of the way for the duration of the bundle.
          $bundledDllPattern = '^((avutil|avcodec|avformat)-[0-9]+|WebView2Loader)\.dll$'
          $quarantineDirectory = Join-Path $env:RUNNER_TEMP "windows-unbundled-dlls"
          New-Item -ItemType Directory -Force $quarantineDirectory | Out-Null
          $quarantinedDlls = @(
            Get-ChildItem $releaseDirectory -Filter "*.dll" -File |
              Where-Object { $_.Name -notmatch $bundledDllPattern }
          )
          foreach ($quarantinedDll in $quarantinedDlls) {
            Move-Item $quarantinedDll.FullName `
              (Join-Path $quarantineDirectory $quarantinedDll.Name) -Force
          }
          Write-Host "Withheld $($quarantinedDlls.Count) DLLs from the installers."

          $bundleExitCode = 1
          try {
            bun run tauri -- bundle --ci --bundles nsis,msi --config $runtimeConfig
            $bundleExitCode = $LASTEXITCODE
          } finally {
            # Restore the staging directory even when bundling fails, so a rerun
            # of this job does not start from a half-emptied release directory.
            foreach ($quarantinedDll in $quarantinedDlls) {
              Move-Item (Join-Path $quarantineDirectory $quarantinedDll.Name) `
                (Join-Path $releaseDirectory $quarantinedDll.Name) -Force
            }
          }
          if ($bundleExitCode -ne 0) { exit $bundleExitCode }

          $setup = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($setup.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable, found $($setup.Count)."
          }
          Copy-Item $setup[0].FullName `
            "release-assets/windows/rLive_$($env:RELEASE_VERSION)_windows-x64-setup.exe"

          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI installer, found $($msi.Count)."
          }
          Copy-Item $msi[0].FullName `
            "release-assets/windows/rLive_$($env:RELEASE_VERSION)_windows-x64.msi"

          if (Get-ChildItem "release-assets/windows" -Recurse -Filter "*.dll" -File) {
            throw "Windows release assets unexpectedly contain ASR runtime DLLs."
          }

          # That check only sees loose files next to the installers, which is how
          # the MSI shipped the ASR runtime unnoticed for several releases. Read
          # the MSI File table and the NSIS payload listing instead, so both
          # installers are asserted on their actual contents.
          $expectedNames = @($runtimeFiles | ForEach-Object { $_.Name })
          $msiPath = (Resolve-Path `
            "release-assets/windows/rLive_$($env:RELEASE_VERSION)_windows-x64.msi").Path

          # 7z reports the MSI payload under WiX's generated component ids
          # ("PathFile_I26a8b29..."), so the real names have to come from the
          # File table. The query runs under Windows PowerShell rather than this
          # step's pwsh: the WindowsInstaller COM automation is what ships with
          # the OS and is exercised there, and pwsh 7 COM interop on
          # parameterized properties such as StringData is less dependable.
          $msiQueryScript = Join-Path $env:RUNNER_TEMP "read-msi-file-table.ps1"
          # Assembled line by line rather than as a here-string: a here-string
          # inside a YAML block would carry this step's indentation into the
          # generated script and tie it to the block's nesting depth.
          @(
            'param([Parameter(Mandatory = $true)][string] $Path)',
            '$ErrorActionPreference = "Stop"',
            '$msiInstaller = New-Object -ComObject WindowsInstaller.Installer',
            '$database = $msiInstaller.OpenDatabase($Path, 0)',
            '$view = $database.OpenView(''SELECT `FileName` FROM `File`'')',
            '$view.Execute()',
            'while ($null -ne ($record = $view.Fetch())) {',
            '  # FileName is "SHORTNME.DLL|the real long name.dll" whenever the',
            '  # file needs a short alias, so the long name is the trailing field.',
            '  ($record.StringData(1) -split ''\|'')[-1]',
            '}'
          ) | Set-Content $msiQueryScript -Encoding ascii
          $msiPayload = @(& powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File $msiQueryScript -Path $msiPath)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($msiPayload.Count -eq 0) { throw "Reading the MSI File table returned no rows." }

          # The NSIS side is read from the installer script tauri renders and
          # hands to makensis, which is the authoritative list of what the setup
          # writes into the installation directory. Extracting the built .exe
          # instead would need a 7-Zip on PATH that nothing else in this workflow
          # relies on.
          $nsisScript = @(Get-ChildItem "src-tauri/target/release/nsis" -Recurse `
            -Filter "installer.nsi" -File)
          if ($nsisScript.Count -ne 1) {
            throw "Expected exactly one rendered installer.nsi, found $($nsisScript.Count)."
          }
          # Both `File "<src>"` (the main binary) and
          # `File /a "/oname=<name>" "<src>"` (every resource) appear; the
          # installed name is the /oname value when present and the source file
          # name otherwise.
          $nsisPayload = @(
            Get-Content $nsisScript[0].FullName |
              ForEach-Object {
                # [regex]::Match, not -match: the latter writes $matches, which
                # the -notmatch in the assertion loop below overwrites in turn.
                $named = [regex]::Match($_, '^\s*File\s+/a\s+"/oname=([^"]+)"')
                if ($named.Success) {
                  Split-Path $named.Groups[1].Value -Leaf
                } else {
                  $plain = [regex]::Match($_, '^\s*File\s+"([^"]+)"\s*$')
                  if ($plain.Success) { Split-Path $plain.Groups[1].Value -Leaf }
                }
              }
          )
          if ($nsisPayload.Count -eq 0) { throw "Reading the NSIS payload returned no entries." }

          foreach ($packaged in @(
            @{ Name = "MSI"; Payload = $msiPayload },
            @{ Name = "NSIS setup"; Payload = $nsisPayload }
          )) {
            $payloadDlls = @(
              $packaged.Payload | Where-Object { $_ -like "*.dll" } | Sort-Object -Unique
            )
            $unbundled = @($payloadDlls | Where-Object { $_ -notmatch $bundledDllPattern })
            if ($unbundled.Count -gt 0) {
              throw "$($packaged.Name) payload ships DLLs it must not carry: $($unbundled -join ', ')"
            }
            $missing = @(
              $expectedNames | Where-Object { $packaged.Payload -notcontains $_ }
            )
            if ($missing.Count -gt 0) {
              throw "$($packaged.Name) payload is missing staged runtime files: $($missing -join ', ')"
            }
            Write-Host "$($packaged.Name) payload carries $($payloadDlls.Count) DLLs, all expected."
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release-assets/windows/*.exe
            release-assets/windows/*.msi
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x86_64 package
    needs: verify-version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libclang-dev \
            libssl-dev \
            nasm \
            pkg-config \
            patchelf \
            rpm \
            cpio \
            libarchive-tools \
            xvfb

      # The distro `libav*-dev` packages are deliberately absent: FFmpeg comes
      # from the pinned source build below, and leaving the system headers
      # installed would let a misconfigured build silently fall back to them.
      - name: Build static FFmpeg libraries
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/prepare-linux-ffmpeg.sh

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify Linux packages with ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          # Every check below is a bare `test`/`diff` under `set -e`, so a failure
          # otherwise aborts the step with no indication of which one tripped.
          error_trap='echo "::error::Linux 包校验失败于第 ${LINENO} 行" >&2'
          trap "$error_trap" ERR

          # `set +e` stops a non-zero status from aborting the step but does NOT
          # stop the ERR trap from firing, so the deliberately-non-zero commands
          # below (`timeout` returning 124 on a healthy smoke start, the rpm
          # extraction probes) each logged a bogus "校验失败" line — run
          # 32785100701 reported line 203 while every step succeeded. Clear and
          # restore the trap around those regions with an inline `trap - ERR`.
          # It has to be inline rather than a `suspend_error_trap` helper: a
          # `trap - ERR` executed inside a helper only applies to that helper's
          # own scope, so the caller's trap is back in force as soon as it
          # returns. Inline in the same scope works, including inside
          # smoke_start.

          bun run bundle:linux -- --ffmpeg-static

          release_dir="$PWD/src-tauri/target/release"
          runtime_manifest="$RUNNER_TEMP/rlive-linux-runtime.manifest"
          find "$release_dir" -maxdepth 1 -type f -name '*.so*' -printf '%f\n' | sort > "$runtime_manifest"
          test -s "$runtime_manifest"
          test -f "$release_dir/libsherpa-onnx-c-api.so"
          test -f "$release_dir/libonnxruntime.so"
          test ! -e "$release_dir/libonnxruntime_providers_cuda.so"

          # Every check names what it rejected: these run against four different
          # package layouts, and a bare `test` under `set -e` aborts the step
          # without saying which package or which condition failed.
          verify_runtime() {
            local binary="$1"
            local runtime_dir="$2"
            local expected_rpath="$3"
            local actual_manifest
            actual_manifest="$(mktemp)"
            echo "校验运行库布局: $runtime_dir"
            if [[ ! -d "$runtime_dir" ]]; then
              echo "::error::运行库目录不存在: $runtime_dir" >&2
              find "$(dirname "$runtime_dir")" -maxdepth 2 >&2 || true
              exit 1
            fi
            find "$runtime_dir" -maxdepth 1 -type f -name '*.so*' -printf '%f\n' | sort > "$actual_manifest"
            if ! diff -u "$runtime_manifest" "$actual_manifest"; then
              echo "::error::$runtime_dir 的运行库清单与 release staging 不一致" >&2
              exit 1
            fi
            if [[ ! -x "$binary" ]]; then
              echo "::error::可执行文件缺失或不可执行: $binary" >&2
              exit 1
            fi
            for required in libsherpa-onnx-c-api.so libonnxruntime.so; do
              if [[ ! -f "$runtime_dir/$required" ]]; then
                echo "::error::缺少 $required: $runtime_dir" >&2
                exit 1
              fi
            done
            if ! readelf -d "$binary" | grep -Fq '$ORIGIN'; then
              echo "::error::$binary 的 RUNPATH 缺少 \$ORIGIN" >&2
              readelf -d "$binary" >&2
              exit 1
            fi
            # `expected_rpath` is a space-separated list of acceptable values, so
            # AppImage can be checked too: linuxdeploy gathers the libraries it
            # bundles into `usr/lib` and rewrites RUNPATH to its own layout,
            # dropping the `$ORIGIN/../lib/rLive` that build.rs links in. The
            # binding check that actually matters is the `ldd` pass below; this
            # one only rejects a binary whose search path lost `$ORIGIN`
            # entirely.
            local rpath_matched=""
            local candidate
            for candidate in $expected_rpath; do
              if readelf -d "$binary" | grep -Fq "$candidate"; then
                rpath_matched="$candidate"
                break
              fi
            done
            if [[ -z "$rpath_matched" ]]; then
              echo "::error::$binary 的 RUNPATH 不含以下任一候选: $expected_rpath" >&2
              readelf -d "$binary" >&2
              find "$runtime_dir" -maxdepth 1 -name '*.so*' -printf '  %f\n' >&2 || true
              exit 1
            fi
            if readelf -d "$binary" | grep -Fq 'sherpa-onnx-prebuilt'; then
              echo "ELF 不得保留构建缓存的 Sherpa RUNPATH: $binary" >&2
              exit 1
            fi
            if ldd "$binary" | grep -q 'not found'; then
              echo "::error::$binary 存在无法解析的动态库依赖" >&2
              ldd "$binary" >&2
              exit 1
            fi
            for required in libsherpa-onnx-c-api.so libonnxruntime.so; do
              if ! ldd "$binary" | grep -Fq "$required"; then
                echo "::error::$binary 未链接 $required" >&2
                ldd "$binary" >&2
                exit 1
              fi
            done
            # FFmpeg is linked from the pinned static archives, so no `libav*`
            # or `libswresample` NEEDED entry may survive. Without this the
            # packages would silently depend on the build machine's `libav*.so`
            # and fail to start wherever that soname is absent — which is the
            # exact failure the static build exists to prevent. Read NEEDED from
            # readelf rather than ldd: ldd also lists transitive dependencies,
            # and libavcodec reached through another library would be a
            # different bug than this one.
            if readelf -d "$binary" | grep -E '\(NEEDED\)' \
              | grep -Eq 'libav(format|codec|util|device|filter)|libsw(resample|scale)'; then
              echo "::error::$binary 动态依赖 FFmpeg，应为静态链接" >&2
              readelf -d "$binary" | grep -E '\(NEEDED\)' >&2
              exit 1
            fi
          }

          # Staying alive for the whole 8 s window (timeout's exit 124) is the
          # pass condition: any other status means the app exited on its own,
          # which for these packages is almost always a loader failure.
          smoke_start() {
            local binary="$1"
            local state_dir="$2"
            echo "启动冒烟测试: $binary"
            set +e
            trap - ERR
            xvfb-run -a env \
              XDG_DATA_HOME="$state_dir/data" \
              XDG_CONFIG_HOME="$state_dir/config" \
              XDG_CACHE_HOME="$state_dir/cache" \
              timeout --signal=TERM 8s "$binary"
            local status=$?
            trap "$error_trap" ERR
            set -e
            if [[ "$status" -ne 124 ]]; then
              echo "::error::$binary 未存活满 8 秒即退出 (退出码 $status)" >&2
              exit 1
            fi
          }

          verify_runtime "$release_dir/rlive" "$release_dir" '$ORIGIN/../lib/rLive'
          smoke_start "$release_dir/rlive" "$RUNNER_TEMP/rlive-release-smoke"

          mapfile -t deb_files < <(find "$release_dir/bundle/deb" -maxdepth 1 -type f -name '*.deb' | sort)
          test "${#deb_files[@]}" -eq 1
          deb_dir="$RUNNER_TEMP/rlive-deb-contents"
          dpkg-deb --extract "${deb_files[0]}" "$deb_dir"
          verify_runtime "$deb_dir/usr/bin/rlive" "$deb_dir/usr/lib/rLive" '$ORIGIN/../lib/rLive'
          smoke_start "$deb_dir/usr/bin/rlive" "$RUNNER_TEMP/rlive-deb-smoke"

          mapfile -t rpm_files < <(find "$release_dir/bundle/rpm" -maxdepth 1 -type f -name '*.rpm' | sort)
          test "${#rpm_files[@]}" -eq 1
          rpm_dir="$RUNNER_TEMP/rlive-rpm-contents"
          mkdir -p "$rpm_dir"
          # `rpm2archive` is tried first: it is the maintained tool, and `-n`
          # keeps the tar uncompressed on stdout. Its entries carry a `./`
          # prefix, which `tar -x` strips, so the layout matches the `usr/...`
          # tree the assertions below expect.
          #
          # `bsdtar` is the fallback rather than `rpm2cpio` because it is the
          # only genuinely independent path. Both rpm tools go through librpm,
          # which verifies the payload digest before handing anything over, so a
          # librpm-side rejection fails identically in both. libarchive has its
          # own rpm filter that skips the header and decompresses the payload
          # directly, so it still extracts when librpm refuses.
          #
          # An empty payload counts as a failure: `rpm2cpio` reports the number
          # of bytes it copied and treats zero as an error without writing
          # anything to stderr, which is exactly what the previous run showed —
          # a non-zero exit, no diagnostics, and a package whose header `rpm -qp`
          # could still read. `rpm -Kv` below names each digest check instead of
          # leaving that to inference.
          rpm_payload="$RUNNER_TEMP/rlive-rpm-payload.tar"
          rpm_extract_log="$RUNNER_TEMP/rlive-rpm-extract.log"

          echo "rpm 载荷与摘要校验:"
          rpm -Kv "${rpm_files[0]}" || true

          extracted_with=""
          set +e
          trap - ERR
          rpm2archive -n - < "${rpm_files[0]}" > "$rpm_payload" 2> "$rpm_extract_log"
          rpm2archive_status=$?
          trap "$error_trap" ERR
          set -e
          if [[ "$rpm2archive_status" -eq 0 && -s "$rpm_payload" ]]; then
            extracted_with="rpm2archive"
            tar -xf "$rpm_payload" -C "$rpm_dir"
          else
            echo "rpm2archive 未产出可用载荷 (退出码 $rpm2archive_status)，改用 bsdtar" >&2
            sed 's/^/  rpm2archive: /' "$rpm_extract_log" >&2 || true
            set +e
            trap - ERR
            bsdtar -xf "${rpm_files[0]}" -C "$rpm_dir" 2> "$rpm_extract_log"
            bsdtar_status=$?
            trap "$error_trap" ERR
            set -e
            if [[ "$bsdtar_status" -ne 0 ]]; then
              echo "::error::无法解出 ${rpm_files[0]} 的载荷 (bsdtar 退出码 $bsdtar_status)" >&2
              sed 's/^/  bsdtar: /' "$rpm_extract_log" >&2 || true
              rpm --version >&2
              rpm -qp --qf 'PAYLOADCOMPRESSOR=%{PAYLOADCOMPRESSOR}\nPAYLOADFORMAT=%{PAYLOADFORMAT}\nARCHIVESIZE=%{ARCHIVESIZE}\n' \
                "${rpm_files[0]}" >&2 || true
              ls -l "${rpm_files[0]}" >&2
              df -h "$RUNNER_TEMP" >&2 || true
              # Keep the package itself for offline analysis: this failure has
              # already survived two rounds of reasoning from logs alone.
              mkdir -p "$PWD/rpm-failure"
              cp "${rpm_files[0]}" "$PWD/rpm-failure/" || true
              exit 1
            fi
            extracted_with="bsdtar"
          fi
          echo "rpm 载荷已由 $extracted_with 解出"
          verify_runtime "$rpm_dir/usr/bin/rlive" "$rpm_dir/usr/lib/rLive" '$ORIGIN/../lib/rLive'
          smoke_start "$rpm_dir/usr/bin/rlive" "$RUNNER_TEMP/rlive-rpm-smoke"

          mapfile -t appimage_files < <(find "$release_dir/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' | sort)
          test "${#appimage_files[@]}" -eq 1
          appimage_file="$(realpath "${appimage_files[0]}")"
          appimage_dir="$RUNNER_TEMP/rlive-appimage-contents"
          mkdir -p "$appimage_dir"
          (cd "$appimage_dir" && "$appimage_file" --appimage-extract >/dev/null)
          # linuxdeploy rewrites RUNPATH to the layout it deploys, so accept its
          # `$ORIGIN/../lib` alongside the value build.rs links in. That value
          # resolves because linuxdeploy copies the runtime it deploys up into
          # `usr/lib` as well: run 32785100701 listed `libonnxruntime.so` and
          # `libsherpa-onnx-c-api.so` at both `usr/lib` and `usr/lib/rLive`, and
          # `ldd` passed. Keep the listing and the `ldd` check — if a future
          # linuxdeploy stops copying them, the libraries stay in `rLive/` only,
          # `$ORIGIN/../lib` no longer resolves, and the AppImage is genuinely
          # broken rather than merely differently laid out.
          echo "AppImage 运行库布局:"
          find "$appimage_dir/squashfs-root/usr/lib" -maxdepth 2 \
            \( -name 'libsherpa*' -o -name 'libonnxruntime*' \) -printf '  %P\n' | sort
          verify_runtime "$appimage_dir/squashfs-root/usr/bin/rlive" "$appimage_dir/squashfs-root/usr/lib/rLive" '$ORIGIN/../lib/rLive $ORIGIN/../lib'
          set +e
          trap - ERR
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a env \
            XDG_DATA_HOME="$RUNNER_TEMP/rlive-appimage-smoke/data" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/rlive-appimage-smoke/config" \
            XDG_CACHE_HOME="$RUNNER_TEMP/rlive-appimage-smoke/cache" \
            timeout --signal=TERM 8s "$appimage_file"
          appimage_status=$?
          trap "$error_trap" ERR
          set -e
          if [[ "$appimage_status" -ne 124 ]]; then
            echo "::error::AppImage 未存活满 8 秒即退出 (退出码 $appimage_status)" >&2
            exit 1
          fi

          mkdir -p release-assets/linux
          cp "${deb_files[0]}" "release-assets/linux/rLive_${RELEASE_VERSION}_linux-amd64.deb"
          cp "${rpm_files[0]}" "release-assets/linux/rLive_${RELEASE_VERSION}_linux-x86_64.rpm"
          cp "$appimage_file" "release-assets/linux/rLive_${RELEASE_VERSION}_linux-x86_64.AppImage"

      - name: Upload the rpm that failed extraction
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-rpm-failure
          path: rpm-failure/*.rpm
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release-assets/linux/*.deb
            release-assets/linux/*.rpm
            release-assets/linux/*.AppImage
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.arch }} package
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build static FFmpeg libraries
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/prepare-macos-ffmpeg.sh --arch "${{ matrix.arch }}"

      - name: Build macOS app and DMG
        shell: bash
        run: |
          set -euo pipefail
          # `ffmpeg-static` makes `ffmpeg-sys-next` ask pkg-config for
          # `Libs.private`, so the static archives' transitive dependencies
          # (zlib, libm, the Secure Transport frameworks) reach the linker. It is
          # a feature rather than a macOS-only dependency entry because Cargo
          # unions features across target sections, which would drag Windows and
          # Linux into static linking too.
          bun run tauri -- build --ci --bundles dmg --target "${{ matrix.target }}" \
            --features ffmpeg-static

          # Tauri deletes rLive.app after creating the DMG, so verify the
          # remaining cargo binary and the app copied into the disk image.
          binary="src-tauri/target/${{ matrix.target }}/release/rlive"
          test -x "$binary"
          file "$binary"

          # FFmpeg is linked statically so the DMG runs on a Mac without
          # Homebrew. A dylib reference here means the prepare step produced a
          # shared build, or pkg-config resolved to Homebrew's FFmpeg instead of
          # the pinned prefix — either way the app would fail to launch for
          # users, and only for them.
          if otool -L "$binary" | grep -Ei 'libav(format|codec|util)|libswresample'; then
            echo "macOS binary links FFmpeg dynamically; expected static archives." >&2
            exit 1
          fi
          if otool -L "$binary" | grep -Ei 'sherpa|onnxruntime'; then
            echo "macOS binary unexpectedly links shared ASR runtime libraries." >&2
            exit 1
          fi

          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg_count="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$dmg_count" -eq 1
          dmg_file="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg')"

          mount_point="$RUNNER_TEMP/rlive-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_file" -readonly -nobrowse -mountpoint "$mount_point"
          app_binary="$mount_point/rLive.app/Contents/MacOS/rLive"
          test -x "$app_binary"
          if otool -L "$app_binary" | grep -Ei 'sherpa|onnxruntime'; then
            echo "macOS app unexpectedly links shared ASR runtime libraries." >&2
            hdiutil detach "$mount_point" || true
            exit 1
          fi
          if otool -L "$app_binary" | grep -Ei 'libav(format|codec|util)|libswresample'; then
            echo "macOS app links FFmpeg dynamically; expected static archives." >&2
            hdiutil detach "$mount_point" || true
            exit 1
          fi
          hdiutil detach "$mount_point"

          mkdir -p release-assets/macos
          cp "$dmg_file" \
            "release-assets/macos/rLive_${RELEASE_VERSION}_macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}-release
          path: release-assets/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build signed Android artifacts
    needs: verify-version
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable at 2026-07-28
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing material
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required Android release secret: ${secret_name}" >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/rlive-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore_path" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" \
            > src-tauri/gen/android/app/keystore.properties

      - name: Build and verify signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          bun run tauri -- android build --ci --target aarch64 --apk

          mapfile -t apk_files < <(
            find src-tauri/gen/android/app/build/outputs/apk/universal/release \
              -type f -name '*.apk' ! -name '*unsigned*' | sort
          )
          test "${#apk_files[@]}" -eq 1

          apk_path="${apk_files[0]}"
          mapfile -t apk_native_libs < <(unzip -Z1 "$apk_path" | awk '/^lib\// { print }')
          if [[ "${apk_native_libs[*]}" != "lib/arm64-v8a/librlive_lib.so" ]]; then
            printf 'Unexpected APK native libraries:\n%s\n' "${apk_native_libs[*]}" >&2
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk_path"

          if [[ -n "$ANDROID_CERT_SHA256" ]]; then
            actual_apk_fingerprint="$(
              "$apksigner" verify --print-certs "$apk_path" |
                awk -F ': ' '/certificate SHA-256 digest:/ { print $2; exit }' |
                tr -d ':[:space:]' |
                tr '[:lower:]' '[:upper:]'
            )"
            expected_fingerprint="$(
              printf '%s' "$ANDROID_CERT_SHA256" |
                tr -d ':[:space:]' |
                tr '[:lower:]' '[:upper:]'
            )"
            test -n "$actual_apk_fingerprint"
            if [[ "$actual_apk_fingerprint" != "$expected_fingerprint" ]]; then
              echo "Android APK signing certificate did not match ANDROID_CERT_SHA256." >&2
              exit 1
            fi
          fi

          mkdir -p release-assets/android
          cp "$apk_path" "release-assets/android/rLive_${RELEASE_VERSION}_android-arm64-v8a.apk"

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rlive-release.jks" src-tauri/gen/android/app/keystore.properties

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: release-assets/android/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub Release
    needs:
      - verify-version
      - build-windows
      - build-linux
      - build-macos
      - build-android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Create draft release and attach assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/**/*
